{% extends 'notes_app/base.html' %}

{% block content %}
<div style="max-width: 500px; margin: 50px auto; text-align: center;">
    <h2>Удалить заметку?</h2>

    <div class="note" style="padding: 20px; background: #f8f9fa; border-radius: 10px; margin: 20px 0;">
        <h3>"{{ note.title }}"</h3>
        {% if note.tags %}
            <p><strong>Теги:</strong> {{ note.tags }}</p>
        {% endif %}
        <p>{{ note.content|truncatechars:100 }}</p>
        <small>Создано: {{ note.created_at|date:"d.m.Y H:i" }}</small>
    </div>

    <form method="post" style="margin-top: 20px;">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger"
                style="background: #e74c3c; padding: 10px 30px; font-size: 18px;">
            Да, удалить
        </button>
        <a href="{% url 'note_list' %}" class="btn"
           style="background: #95a5a6; padding: 10px 30px; font-size: 18px;">
            Отмена
        </a>
    </form>
</div>
{% endblock %}
