{% extends 'notes_app/base.html' %}

{% block content %}
<div class="register-page">
    <div class="register-card">
        <header class="register-header">
            <div class="register-icon"></div>
            <h2>Регистрация</h2>
            <p class="register-subtitle">Создайте аккаунт для работы с заметками</p>
        </header>

        <form method="post" class="register-form">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="btn btn-success full-width">
                Зарегистрироваться
            </button>
        </form>

        <div class="register-footer">
            <p>Уже есть аккаунт? <a href="{% url 'login' %}" class="login-link">Войдите</a></p>
        </div>
    </div>
</div>

<style>
    .register-page {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 70vh;
        padding: 40px 20px;
        background: linear-gradient(135deg, #f0fff4 0%, #c6f6d5 100%);
    }

    .register-card {
        background: rgba(255, 255, 255, 0.97);
        backdrop-filter: blur(25px);
        border-radius: 32px;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.4);
        padding: 56px 48px;
        width: 100%;
        max-width: 480px;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        overflow: hidden;
    }

    .register-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 6px;
        background: linear-gradient(90deg, #2ecc71 0%, #27ae60 50%, #229954 100%);
        border-radius: 32px 32px 0 0;
    }

    .register-card:hover {
        box-shadow: 0 35px 70px rgba(0, 0, 0, 0.2);
        transform: translateY(-4px);
    }

    .register-header {
        text-align: center;
        margin-bottom: 44px;
    }

    .register-icon {
        font-size: 4rem;
        margin-bottom: 24px;
        display: block;
        animation: floatIn 1s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    @keyframes floatIn {
        0% {
            opacity: 0;
            transform: translateY(30px) scale(0.8);
        }
        100% {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    .register-header h2 {
        font-size: 2.25rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin: 0 0 12px 0;
    }

    .register-subtitle {
        color: #68d391;
        font-size: 16px;
        font-weight: 500;
        margin: 0;
    }

    .register-form {
        display: flex;
        flex-direction: column;
        gap: 28px;
    }

    .register-form p {
        margin: 0;
    }

    .register-form label {
        display: block;
        margin-bottom: 12px;
        font-weight: 600;
        color: #2d3748;
        font-size: 15px;
    }

    .register-form input {
        padding: 20px 24px;
        border: 2px solid #e2e8f0;
        border-radius: 20px;
        font-size: 16px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(12px);
        font-family: inherit;
    }

    .register-form input:focus {
        outline: none;
        border-color: #2ecc71;
        box-shadow: 0 0 0 4px rgba(46, 204, 113, 0.15);
        transform: translateY(-2px);
        background: rgba(255, 255, 255, 1);
    }

    .full-width {
        width: 100%;
    }

    .btn-success {
        background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%) !important;
        box-shadow: 0 14px 32px rgba(46, 204, 113, 0.4) !important;
        font-weight: 700 !important;
        font-size: 16px !important;
        padding: 22px 32px !important;
        border-radius: 20px !important;
        position: relative;
        overflow: hidden;
    }

    .btn-success:hover {
        transform: translateY(-3px) !important;
        box-shadow: 0 20px 40px rgba(46, 204, 113, 0.5) !important;
    }

    .register-footer {
        text-align: center;
        margin-top: 36px;
        padding-top: 28px;
        border-top: 1px solid #e2e8f0;
    }

    .register-footer p {
        margin: 0;
        color: #4a5568;
        font-size: 16px;
    }

    .login-link {
        color: #667eea;
        text-decoration: none;
        font-weight: 700;
        position: relative;
        padding: 6px 16px;
        border-radius: 16px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        background: linear-gradient(135deg, rgba(102, 126, 234, 0.08) 0%, rgba(118, 75, 162, 0.08) 100%);
    }

    .login-link:hover {
        background: linear-gradient(135deg, rgba(102, 126, 234, 0.15) 0%, rgba(118, 75, 162, 0.15) 100%);
        box-shadow: 0 8px 20px rgba(102, 126, 234, 0.2);
        transform: translateY(-1px);
    }

    /* Стили для Django ошибок формы */
    .register-form .errorlist {
        list-style: none;
        padding: 12px 16px;
        margin: 8px 0 0 0;
        background: linear-gradient(135deg, rgba(231, 76, 60, 0.15) 0%, rgba(220, 53, 69, 0.15) 100%);
        border-radius: 16px;
        border-left: 4px solid #e53e3e;
        color: #e53e3e;
        font-size: 14px;
    }

    /* Responsive */
    @media (max-width: 480px) {
        .register-page {
            padding: 24px 16px;
        }

        .register-card {
            padding: 44px 36px;
            margin: 0;
        }

        .register-header h2 {
            font-size: 1.875rem;
        }

        .register-icon {
            font-size: 3.5rem;
        }
    }
</style>
{% endblock %}
